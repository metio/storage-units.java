name: Baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: metio/ci/.github/workflows/baseline.yml@cf9000ee8068987046975a0551cb81a25ce503d0 # 2026.11.3105721
  baseline:
    name: Baseline
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::the baseline checks ended in $RESULT"; exit 1; }'
