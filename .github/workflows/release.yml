name: Release
on:
  schedule:
    - cron: 23 4 4 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@033a5108141e6ad5a42fe4c793641043f6d57b0e # main
    with:
      paths: pom.xml storage-units-dozer storage-units-eclipselink storage-units-gson storage-units-jackson storage-units-jakarta storage-units-mapstruct storage-units-model storage-units-modelmapper storage-units-mongodb storage-units-orika storage-units-simple
    secrets: inherit
