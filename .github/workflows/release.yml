name: Release
on:
  schedule:
    - cron: 23 4 4 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@21ce4ec08a0516b39fcd5985472f0d53ec11e338 # 2026.10.31095959
    with:
      paths: pom.xml storage-units-dozer storage-units-eclipselink storage-units-gson storage-units-jackson storage-units-jakarta storage-units-mapstruct storage-units-model storage-units-modelmapper storage-units-mongodb storage-units-orika storage-units-simple
    secrets: inherit
