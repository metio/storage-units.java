name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  maven:
    name: Maven
    uses: metio/ci/.github/workflows/maven.yml@2c9b3ef3bf280e85541853d686e261dd7b92eac9 # 2026.11.2090039
  github-actions:
    name: github-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1
        with:
          fail_on_error: true
          filter_mode: nofilter
  verify:
    name: Verify
    needs: [maven, github-actions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
